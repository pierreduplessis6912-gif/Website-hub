name = "wh-build"
main = "src/index.js"
compatibility_date = "2024-01-01"
account_id = "4c559b9dff9fae56803b9c275b518597"

[vars]
REGISTERDOMAIN_EMAIL = "loc10@live.co.za"
TEST_MODE = "false"
WORKER_URL_BUILD = "https://wh-build.pierreduplessis6912.workers.dev"
WORKER_URL_PATCH = "https://wh-patch.pierreduplessis6912.workers.dev"
WORKER_URL_LAUNCH = "https://wh-launch.pierreduplessis6912.workers.dev"
WORKER_URL_PULSE = "https://wh-pulse.pierreduplessis6912.workers.dev"
WORKER_URL_REACTIVATE = "https://wh-reactivate.pierreduplessis6912.workers.dev"

[[routes]]
pattern = "preview.websitehub.co.za/*"
zone_name = "websitehub.co.za"

# Service bindings — internal worker-to-worker calls, zero latency
[[services]]
binding = "LAUNCH_WORKER"
service = "wh-launch"

[[services]]
binding = "PATCH_WORKER"
service = "wh-patch"

# KV — content shelf only (HTML blobs, SPA, templates)
[[kv_namespaces]]
binding = "SITES"
id = "b63e5b885ead4c02a9e184dd6477e711"

# R2 — asset storage (photos, logos, gallery)
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "wh-assets"

# D1 — the brain (all client data)
[[d1_databases]]
binding = "DB"
database_name = "website-hub-db"
database_id = "9c422081-af06-4c1b-b59e-f40e0d08fefa"
migrations_dir = "../migrations"

# Queue — build pipeline
[[queues.producers]]
binding = "BUILD_QUEUE"
queue = "wh-build-queue"

[[queues.consumers]]
queue = "wh-build-queue"
max_batch_size = 5
max_batch_timeout = 30

# Cron — outbound prospecting (11pm SAST = 9pm UTC)
[triggers]
crons = ["0 21 * * *"]
