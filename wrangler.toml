# wrangler secret put AIRTABLE_BASE_ID
# wrangler secret put AIRTABLE_TABLE_ID
# wrangler secret put TWILIO_ACCOUNT_SID
# wrangler secret put TWILIO_AUTH_TOKEN
# wrangler secret put TWILIO_WA_FROM
# wrangler secret put WH_PHONE
# wrangler secret put PAYFAST_MERCHANT_ID
# wrangler secret put PAYFAST_MERCHANT_KEY
# wrangler secret put PAYFAST_PASSPHRASE
# wrangler secret put ZOHO_CLIENT_ID
