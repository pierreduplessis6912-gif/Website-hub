name = "dropbox-proxy"
main = "worker1.js"
compatibility_date = "2024-01-01"

# KV — shared with Worker 2 (same namespace ID)
[[kv_namespaces]]
binding = "SITES"
id = "b63e5b885ead4c02a9e184dd6477e711"

# R2 — brand assets and gallery photos
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "wh-assets"

# Queue — build jobs
[[queues.producers]]
binding = "BUILD_QUEUE"
queue = "build-queue"

[[queues.consumers]]
queue = "build-queue"
max_batch_size = 1
max_retries = 3

# Cron — fires at 11pm SAST (UTC+2) = 9pm UTC
[triggers]
crons = ["0 21 * * *"]

# ─────────────────────────────────────────────
