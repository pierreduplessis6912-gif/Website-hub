name = "wh-enrichment-worker"
main = "wh-enrichment-worker.js"
compatibility_date = "2024-01-01"

# KV â€” shared with Worker 1 (same namespace ID)
[[kv_namespaces]]
binding = "SITES"
id = "b63e5b885ead4c02a9e184dd6477e711"

# R2 â€” brand assets and gallery photos
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "wh-assets"

# Incoming email handler â€” updates@websitehub.co.za
# Wire this in Cloudflare Email Routing after deploy:
# Destination: wh-enrichment-worker (Worker)
[[email_routing.rules]]
matchers = [{ type = "literal", field = "to", value = "updates@websitehub.co.za" }]
actions = [{ type = "worker", destination = "wh-enrichment-worker" }]

