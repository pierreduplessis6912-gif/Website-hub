name = "wh-launch"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ── KV Namespaces ──────────────────────────────────────────────
[[kv_namespaces]]
binding = "SITES"
id = "<KV_NAMESPACE_ID>"

# ── Queues (Producer — upgrade triggers rebuild) ───────────────
[[queues.producers]]
binding = "BUILD_QUEUE"
queue = "wh-build-queue"

[vars]
TEST_MODE                  = "true"
WORKER_URL_BUILD           = "https://wh-build.pierreduplessis6912.workers.dev"
WORKER_URL_PATCH           = "https://wh-patch.pierreduplessis6912.workers.dev"

