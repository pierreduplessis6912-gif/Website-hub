name = "wh-pulse"
main = "src/index.js"
compatibility_date = "2024-01-01"
account_id = "4c559b9dff9fae56803b9c275b518597"

[vars]
TEST_MODE = "false"
WORKER_URL_BUILD = "https://wh-build.pierreduplessis6912.workers.dev"
WORKER_URL_LAUNCH = "https://wh-launch.pierreduplessis6912.workers.dev"

# KV — monthly summary HTML, leaderboard cache
[[kv_namespaces]]
binding = "SITES"
id = "b63e5b885ead4c02a9e184dd6477e711"

# D1 — all sequence queries (dunning, post-golive, win-back, referral vesting)
[[d1_databases]]
binding = "DB"
database_name = "website-hub-db"
database_id = "9c422081-af06-4c1b-b59e-f40e0d08fefa"
migrations_dir = "../migrations"

# Cron triggers
# Main daily cron: 06:00 UTC = 08:00 SAST
# Queue drain: every 15 min 07:00-10:00 UTC = 09:00-12:00 SAST, Tue-Thu
[triggers]
crons = [
  "0 6 * * *",
  "*/15 7-10 * * 2-4"
]

[[queues.producers]]
queue = "build-queue"
binding = "BUILD_QUEUE"

[vars]
WORKER_URL_PULSE = "https://wh-pulse.pierreduplessis6912.workers.dev"
WORKER_URL_REACTIVATE = "https://wh-reactivate.pierreduplessis6912.workers.dev"
