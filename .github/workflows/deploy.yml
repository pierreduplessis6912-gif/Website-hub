name: Deploy Workers

on:
  push:
    branches: [main]

jobs:
  deploy-build:
    name: Deploy wh-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy wh-build
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: build-worker

  deploy-patch:
    name: Deploy wh-patch
    runs-on: ubuntu-latest
    needs: deploy-build
    steps:
      - uses: actions/checkout@v4
      - name: Deploy wh-patch
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: patch-worker

  deploy-launch:
    name: Deploy wh-launch
    runs-on: ubuntu-latest
    needs: deploy-patch
    steps:
      - uses: actions/checkout@v4
      - name: Deploy wh-launch
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: launch-worker
