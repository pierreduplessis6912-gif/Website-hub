name: Deploy Workers

on:
  push:
    branches: [main]

jobs:
  deploy-build:
    name: Deploy wh-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync design and photo databases
        run: |
          cp design-db.js build-worker/src/design-db.js
          cp photo-db.js build-worker/src/photo-db.js
      - name: Deploy wh-build
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: build-worker
          wranglerVersion: "3.90.0"

  deploy-patch:
    name: Deploy wh-patch
    runs-on: ubuntu-latest
    needs: deploy-build
    steps:
      - uses: actions/checkout@v4
      - name: Sync shared-services
        run: cp build-worker/src/shared-services.js patch-worker/src/shared-services.js
      - name: Deploy wh-patch
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: patch-worker
          wranglerVersion: "3.90.0"

  deploy-launch:
    name: Deploy wh-launch
    runs-on: ubuntu-latest
    needs: deploy-patch
    steps:
      - uses: actions/checkout@v4
      - name: Sync shared-services
        run: cp build-worker/src/shared-services.js launch-worker/src/shared-services.js
      - name: Deploy wh-launch
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: launch-worker
          wranglerVersion: "3.90.0"

  deploy-pulse:
    name: Deploy wh-pulse
    runs-on: ubuntu-latest
    needs: deploy-launch
    steps:
      - uses: actions/checkout@v4
      - name: Sync shared-services
        run: cp build-worker/src/shared-services.js pulse-worker/src/shared-services.js
      - name: Deploy wh-pulse
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: pulse-worker
          wranglerVersion: "3.90.0"

  deploy-reactivate:
    name: Deploy wh-reactivate
    runs-on: ubuntu-latest
    needs: deploy-pulse
    steps:
      - uses: actions/checkout@v4
      - name: Sync shared-services
        run: cp build-worker/src/shared-services.js reactivate-worker/src/shared-services.js
      - name: Deploy wh-reactivate
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: reactivate-worker
          wranglerVersion: "3.90.0"
