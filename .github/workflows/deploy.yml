name: Deploy Workers

on:
  push:
    branches: [main]

jobs:
  deploy-build:
    name: Deploy wh-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy wh-build
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: build-worker
          secrets: |
            ANTHROPIC_KEY
            UNSPLASH_ACCESS_KEY
            WH_PHONE
            EVOLUTION_API_URL
            EVOLUTION_API_KEY
            EVOLUTION_INSTANCE
            ADMIN_KEY
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            GOOGLE_REFRESH_TOKEN
        env:
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          WH_PHONE: ${{ secrets.WH_PHONE }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

  deploy-patch:
    name: Deploy wh-patch
    runs-on: ubuntu-latest
    needs: deploy-build
    steps:
      - uses: actions/checkout@v4
      - name: Sync shared-services
        run: cp build-worker/src/shared-services.js patch-worker/src/shared-services.js
      - name: Deploy wh-patch
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: patch-worker

  deploy-launch:
    name: Deploy wh-launch
    runs-on: ubuntu-latest
    needs: deploy-patch
    steps:
      - uses: actions/checkout@v4
      - name: Sync shared-services
        run: cp build-worker/src/shared-services.js launch-worker/src/shared-services.js
      - name: Deploy wh-launch
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: launch-worker
          secrets: |
            PAYFAST_MERCHANT_KEY
            PAYFAST_PASSPHRASE
            PAYFAST_SANDBOX_MERCHANT_ID
            PAYFAST_SANDBOX_MERCHANT_KEY
            ANTHROPIC_KEY
            WH_PHONE
            ADMIN_KEY
            CF_API_TOKEN
        env:
          PAYFAST_MERCHANT_KEY: ${{ secrets.PAYFAST_MERCHANT_KEY }}
          PAYFAST_PASSPHRASE: ${{ secrets.PAYFAST_PASSPHRASE }}
          PAYFAST_SANDBOX_MERCHANT_ID: ${{ secrets.PAYFAST_SANDBOX_MERCHANT_ID }}
          PAYFAST_SANDBOX_MERCHANT_KEY: ${{ secrets.PAYFAST_SANDBOX_MERCHANT_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          WH_PHONE: ${{ secrets.WH_PHONE }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

  deploy-pulse:
    name: Deploy wh-pulse
    runs-on: ubuntu-latest
    needs: deploy-launch
    steps:
      - uses: actions/checkout@v4
      - name: Sync shared-services
        run: cp build-worker/src/shared-services.js pulse-worker/src/shared-services.js
      - name: Deploy wh-pulse
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: pulse-worker
          secrets: |
            RESEND_API_KEY
            WH_PHONE
            ADMIN_KEY
            EVOLUTION_API_URL
            EVOLUTION_API_KEY
            EVOLUTION_INSTANCE
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WH_PHONE: ${{ secrets.WH_PHONE }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}

  deploy-reactivate:
    name: Deploy wh-reactivate
    runs-on: ubuntu-latest
    needs: deploy-pulse
    steps:
      - uses: actions/checkout@v4
      - name: Sync shared-services
        run: cp build-worker/src/shared-services.js reactivate-worker/src/shared-services.js
      - name: Deploy wh-reactivate
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: reactivate-worker
          secrets: |
            WH_PHONE
            ADMIN_KEY
            EVOLUTION_API_URL
            EVOLUTION_API_KEY
            EVOLUTION_INSTANCE
        env:
          WH_PHONE: ${{ secrets.WH_PHONE }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
