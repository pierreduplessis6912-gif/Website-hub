name: Deploy Workers

on:
  push:
    branches: [main]

jobs:
  migrate:
    name: Apply D1 migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply website-hub-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-build:
    name: Deploy wh-build
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4
      - name: Deploy wh-build
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: build-worker

  deploy-patch:
    name: Deploy wh-patch
    runs-on: ubuntu-latest
    needs: deploy-build
    steps:
      - uses: actions/checkout@v4
      - name: Deploy wh-patch
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: patch-worker

  deploy-launch:
    name: Deploy wh-launch
    runs-on: ubuntu-latest
    needs: deploy-patch
    steps:
      - uses: actions/checkout@v4
      - name: Deploy wh-launch
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: launch-worker

  deploy-pulse:
    name: Deploy wh-pulse
    runs-on: ubuntu-latest
    needs: deploy-launch
    steps:
      - uses: actions/checkout@v4
      - name: Deploy wh-pulse
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: pulse-worker

  deploy-reactivate:
    name: Deploy wh-reactivate
    runs-on: ubuntu-latest
    needs: deploy-pulse
    steps:
      - uses: actions/checkout@v4
      - name: Deploy wh-reactivate
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: reactivate-worker
