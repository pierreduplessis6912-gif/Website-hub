name = "wh-patch"
main = "src/index.js"
compatibility_date = "2024-01-01"
account_id = "4c559b9dff9fae56803b9c275b518597"

[vars]
TEST_MODE = "true"
WORKER_URL_BUILD = "https://wh-build.pierreduplessis6912.workers.dev"

# KV — content shelf only
[[kv_namespaces]]
binding = "SITES"
id = "b63e5b885ead4c02a9e184dd6477e711"

# R2 — photo and asset uploads
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "wh-assets"

# D1 — client data, gallery records, revision history
[[d1_databases]]
binding = "DB"
database_name = "website-hub-db"
database_id = "9c422081-af06-4c1b-b59e-f40e0d08fefa"
migrations_dir = "../migrations"

# Email routing — receives updates@websitehub.co.za
[send_email]
binding = "EMAIL"
