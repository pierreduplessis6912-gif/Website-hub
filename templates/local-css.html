<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700&display=swap');

:root {
  --bg-color: #faf8f3;
  --bg-white: #ffffff;
  --bg-subtle: #fdf5f0;
  --bg-card: #fcf9f5;
  --text-main: #2c2416;
  --text-muted: #5c503e;
  --accent-color: #c1622f;
  --accent-hover: #a34e21;
  --border-color: #e6dac8;
  --wa-color: #25d366;
  
  --font-heading: 'Fraunces', serif;
  --font-body: 'DM Sans', sans-serif;
  
  --nav-height: 85px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-pill: 50px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background-color: var(--bg-color);
  color: var(--text-main);
  font-family: var(--font-body);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5, h6, .heading {
  font-family: var(--font-heading);
  color: var(--text-main);
  line-height: 1.15;
  font-weight: 600;
}

a {
  text-decoration: none;
  color: inherit;
  transition: all 0.2s ease;
}

img {
  max-width: 100%;
  display: block;
  border-radius: var(--radius-md);
}

.container {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
}

/* Texture overlay for hero and subtle backgrounds */
.bg-texture {
  background-image: 
    radial-gradient(var(--border-color) 1px, transparent 1px);
  background-size: 20px 20px;
}

/* Navigation */
nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--nav-height);
  background-color: var(--bg-color);
  z-index: 100;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
}

.nav-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
}

.logo {
  font-family: var(--font-heading);
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: -0.02em;
}

.nav-links {
  display: flex;
  gap: 2rem;
  align-items: center;
}

.nav-links a:not(.nav-btn) {
  font-size: 1.05rem;
  font-weight: 500;
  color: var(--text-muted);
}

.nav-links a:not(.nav-btn):hover, 
.nav-links a:not(.nav-btn).active {
  color: var(--accent-color);
}

.hamburger {
  display: none;
  background: none;
  border: none;
  font-size: 2rem;
  cursor: pointer;
  color: var(--text-main);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 28px;
  font-weight: 600;
  font-size: 1.05rem;
  border-radius: var(--radius-pill);
  cursor: pointer;
  border: none;
  text-align: center;
  transition: all 0.2s ease;
  font-family: var(--font-body);
}

.btn-primary {
  background-color: var(--accent-color);
  color: #fff !important;
}

.btn-primary:hover {
  background-color: var(--accent-hover);
}

.btn-outline {
  background-color: transparent;
  color: var(--text-main);
  border: 2px solid var(--border-color);
}

.btn-outline:hover {
  border-color: var(--text-main);
  background-color: var(--bg-white);
}

.btn-text {
  color: var(--accent-color);
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-text:hover {
  color: var(--accent-hover);
  gap: 10px;
}

.btn-wa {
  background-color: var(--wa-color);
  color: white !important;
}

.btn-wa:hover {
  background-color: #128C7E;
}

/* Sections */
section {
  padding: 80px 0;
}

.bg-white { background-color: var(--bg-white); }
.bg-subtle { background-color: var(--bg-subtle); }
.bg-dark { background-color: var(--text-main); color: var(--bg-color); }
.bg-dark * { color: var(--bg-color); }

.section-header {
  text-align: center;
  margin-bottom: 3.5rem;
}

.section-tag {
  color: var(--accent-color);
  font-weight: 700;
  font-size: 0.95rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 0.75rem;
  display: inline-block;
}

.section-header h2 {
  font-size: 2.8rem;
}

/* Hero */
.hero {
  min-height: 75vh;
  display: flex;
  align-items: center;
  padding-top: var(--nav-height);
  background-color: var(--bg-color);
  position: relative;
}

.hero-short {
  min-height: 40vh;
  padding-top: calc(var(--nav-height) + 60px);
  padding-bottom: 60px;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 60px;
  align-items: center;
}

.badge {
  display: inline-block;
  background-color: var(--bg-subtle);
  color: var(--accent-color);
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  font-size: 0.95rem;
  font-weight: 600;
  margin-bottom: 1.5rem;
  border: 1px solid rgba(193, 98, 47, 0.2);
}

.hero h1 {
  font-size: 4.2rem;
  margin-bottom: 1.5rem;
  letter-spacing: -0.02em;
}

.hero .accent-word {
  color: var(--accent-color);
  font-style: italic;
}

.hero p {
  font-size: 1.25rem;
  color: var(--text-muted);
  margin-bottom: 2.5rem;
  max-width: 500px;
  line-height: 1.7;
}

.hero-buttons {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
}

/* Community Badges */
.badge-strip {
  background-color: var(--bg-subtle);
  padding: 24px 0;
  border-top: 1px dashed var(--border-color);
  border-bottom: 1px dashed var(--border-color);
}

.badge-flex {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

.community-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  background-color: var(--bg-white);
  padding: 10px 20px;
  border-radius: var(--radius-pill);
  font-weight: 500;
  font-size: 0.95rem;
  color: var(--text-main);
  box-shadow: 0 2px 8px rgba(44, 36, 22, 0.05);
  border: 1px solid var(--border-color);
}

.community-badge::before {
  content: '✦';
  color: var(--accent-color);
  font-size: 1.2rem;
}

/* Grids */
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }

/* Service Cards */
.service-card {
  background-color: var(--bg-card);
  padding: 35px 30px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  box-shadow: 0 4px 15px rgba(0,0,0,0.02);
  display: flex;
  flex-direction: column;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.service-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 25px rgba(44, 36, 22, 0.06);
}

.card-icon {
  font-size: 3rem;
  margin-bottom: 1.25rem;
}

.service-card h3 {
  font-size: 1.5rem;
  margin-bottom: 0.75rem;
}

.service-card p {
  color: var(--text-muted);
  margin-bottom: 1.5rem;
  flex-grow: 1;
}

.service-note {
  font-size: 0.9rem;
  color: var(--accent-color);
  font-weight: 500;
  padding-top: 1rem;
  border-top: 1px dashed var(--border-color);
  font-style: italic;
}

/* Process Steps */
.process-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 40px;
  counter-reset: process-counter;
}

.process-step {
  text-align: center;
  position: relative;
  padding: 20px;
}

.process-number {
  width: 60px;
  height: 60px;
  background-color: var(--bg-subtle);
  border: 2px solid var(--accent-color);
  color: var(--accent-color);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-heading);
  font-size: 1.8rem;
  margin: 0 auto 1.5rem auto;
  position: relative;
  z-index: 2;
}

.process-grid .process-step:not(:last-child)::after {
  content: '';
  position: absolute;
  top: 50px;
  left: calc(50% + 30px);
  width: calc(100% - 60px);
  height: 2px;
  border-top: 2px dashed var(--border-color);
  z-index: 1;
}

.process-step h3 {
  font-size: 1.4rem;
  margin-bottom: 0.75rem;
}

.process-step p {
  color: var(--text-muted);
}

/* Testimonials */
.testimonial-card {
  background-color: var(--bg-white);
  padding: 35px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-color);
  position: relative;
  box-shadow: 0 4px 15px rgba(0,0,0,0.03);
}

.testimonial-card::before {
  content: '”';
  position: absolute;
  top: 10px;
  left: 25px;
  font-family: var(--font-heading);
  font-size: 5rem;
  color: var(--bg-subtle);
  line-height: 1;
  z-index: 0;
}

.test-quote {
  font-size: 1.15rem;
  line-height: 1.6;
  color: var(--text-main);
  margin-bottom: 1.5rem;
  position: relative;
  z-index: 1;
}

.test-author {
  display: flex;
  align-items: center;
  gap: 15px;
  border-top: 1px solid var(--border-color);
  padding-top: 1.25rem;
}

.test-author-img {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background-color: var(--accent-color);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-family: var(--font-heading);
}

.test-name {
  font-weight: 600;
  font-size: 1rem;
}

.test-context {
  font-size: 0.85rem;
  color: var(--text-muted);
}

/* CTA Panel */
.cta-panel {
  background-color: var(--bg-subtle);
  border-radius: var(--radius-lg);
  padding: 60px 40px;
  text-align: center;
  margin: 60px auto;
  max-width: 1000px;
  border: 1px solid rgba(193, 98, 47, 0.2);
}

.cta-panel h2 {
  font-size: 2.8rem;
  margin-bottom: 1rem;
}

.cta-panel p {
  font-size: 1.2rem;
  color: var(--text-muted);
  margin-bottom: 2rem;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}

/* Team / Owner Section */
.owner-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  min-height: 400px;
  border-radius: var(--radius-md);
  box-shadow: -15px 15px 0 var(--bg-subtle);
}

.pull-quote {
  font-family: var(--font-heading);
  font-size: 2rem;
  color: var(--accent-color);
  line-height: 1.3;
  margin: 2rem 0;
  border-left: 4px solid var(--accent-color);
  padding-left: 20px;
  font-style: italic;
}

/* Services Detailed Rows */
.service-row {
  padding: 60px 0;
  border-bottom: 1px dashed var(--border-color);
}

.service-row:last-child {
  border-bottom: none;
}

.service-row-inner {
  display: flex;
  align-items: flex-start;
  gap: 40px;
}

.service-row-icon {
  font-size: 4rem;
  background: var(--bg-subtle);
  width: 100px;
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-md);
  flex-shrink: 0;
}

.service-row-content h2 {
  font-size: 2.2rem;
  margin-bottom: 1rem;
}

.service-row-desc {
  font-size: 1.15rem;
  color: var(--text-muted);
  margin-bottom: 1rem;
  max-width: 700px;
}

/* Gallery Grid */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.gallery-item {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-md);
  aspect-ratio: 4/5;
}

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}

.gallery-item:hover img {
  transform: scale(1.05);
}

.gallery-caption {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 30px 20px 20px;
  background: linear-gradient(to top, rgba(44,36,22,0.9) 0%, rgba(44,36,22,0) 100%);
  color: white;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.3s ease;
}

.gallery-item:hover .gallery-caption {
  opacity: 1;
  transform: translateY(0);
}

.gallery-caption p {
  font-size: 1.05rem;
  font-weight: 500;
  line-height: 1.4;
  margin: 0;
}

/* Contact Cards */
.contact-card {
  background: var(--bg-white);
  padding: 40px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-color);
  height: 100%;
}

.contact-card h3 {
  font-size: 1.8rem;
  margin-bottom: 1.5rem;
  color: var(--accent-color);
}

.contact-item {
  margin-bottom: 1.5rem;
}

.contact-item:last-child {
  margin-bottom: 0;
}

.contact-item h4 {
  font-size: 1.1rem;
  margin-bottom: 0.25rem;
  font-family: var(--font-body);
  color: var(--text-muted);
}

.contact-item p {
  font-size: 1.15rem;
  font-weight: 500;
}

.hours-table {
  width: 100%;
  border-collapse: collapse;
}

.hours-table tr {
  border-bottom: 1px solid var(--border-color);
}

.hours-table tr:last-child {
  border-bottom: none;
}

.hours-table td {
  padding: 15px 0;
  font-size: 1.1rem;
}

.hours-table td:last-child {
  text-align: right;
  font-weight: 500;
}

.hours-closed {
  color: var(--accent-color);
  opacity: 0.8;
}

/* WhatsApp FAB */
.fab-wa {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 60px;
  height: 60px;
  background-color: var(--wa-color);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  color: white;
  box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
  z-index: 1000;
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.fab-wa:hover {
  transform: scale(1.1) rotate(-5deg);
  background-color: #128C7E;
}

/* Footer */
footer {
  background-color: var(--text-main);
  color: var(--bg-subtle);
  padding: 60px 0 30px 0;
}

footer h4 {
  color: white;
  font-family: var(--font-body);
  font-size: 1.1rem;
  margin-bottom: 1.5rem;
}

footer p, footer a {
  color: #a89c8a;
}

footer a:hover {
  color: white;
}

.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 40px;
  margin-bottom: 40px;
}

.footer-brand {
  font-family: var(--font-heading);
  font-size: 1.8rem;
  color: white;
  margin-bottom: 1rem;
}

.footer-bottom {
  text-align: center;
  padding-top: 30px;
  border-top: 1px solid rgba(255,255,255,0.1);
  font-size: 0.9rem;
  color: #a89c8a;
}

/* Responsive */
@media (max-width: 720px) {
  .hero-grid { grid-template-columns: 1fr; gap: 30px; }
  .hero h1 { font-size: 3rem; }
  
  .nav-links {
    display: none;
    position: absolute;
    top: var(--nav-height);
    left: 0;
    width: 100%;
    background-color: var(--bg-white);
    flex-direction: column;
    padding: 20px;
    border-bottom: 1px solid var(--border-color);
    align-items: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.05);
  }
  
  .nav-links.active { display: flex; }
  .hamburger { display: block; }
  
  .grid-2, .grid-3, .process-grid { grid-template-columns: 1fr; }
  
  .process-grid .process-step:not(:last-child)::after { display: none; }
  
  .badge-flex { justify-content: center; }
  
  .footer-grid { grid-template-columns: 1fr; text-align: center; }
  
  .service-row-inner { flex-direction: column; gap: 20px; }
  .service-row-icon { width: 80px; height: 80px; font-size: 3rem; }
  
  .gallery-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
