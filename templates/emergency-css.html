<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap');

:root {
  --bg-color: #0a0f1a;
  --surface-color: #141b29;
  --surface-hover: #1c2538;
  --accent-color: #f97316;
  --accent-hover: #ea580c;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --wa-color: #25d366;
  --border-color: #1e293b;
  
  --font-heading: 'Bebas Neue', sans-serif;
  --font-body: 'Inter', sans-serif;
  
  --nav-height: 70px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background-color: var(--bg-color);
  color: var(--text-main);
  font-family: var(--font-body);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, .heading {
  font-family: var(--font-heading);
  text-transform: uppercase;
  line-height: 1.1;
  letter-spacing: 0.05em;
}

a {
  text-decoration: none;
  color: inherit;
}

img {
  max-width: 100%;
  display: block;
}

.container {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
}

/* Nav */
nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--nav-height);
  background-color: rgba(10, 15, 26, 0.95);
  backdrop-filter: blur(10px);
  z-index: 100;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
}

.nav-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
}

.logo {
  font-family: var(--font-heading);
  font-size: 1.5rem;
  font-weight: bold;
  letter-spacing: 1px;
}

.nav-links {
  display: flex;
  gap: 2rem;
}

.nav-links a {
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--text-muted);
  transition: color 0.2s;
}

.nav-links a:hover, .nav-links a.active {
  color: var(--accent-color);
}

.nav-phone {
  background-color: var(--surface-color);
  color: var(--text-main);
  padding: 8px 16px;
  border-radius: 4px;
  font-weight: 600;
  font-size: 0.9rem;
  border: 1px solid var(--border-color);
  transition: all 0.2s;
}

.nav-phone:hover {
  border-color: var(--accent-color);
  color: var(--accent-color);
}

.hamburger {
  display: none;
  background: none;
  border: none;
  color: var(--text-main);
  font-size: 1.5rem;
  cursor: pointer;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 28px;
  font-weight: 600;
  font-size: 1rem;
  border-radius: 4px;
  transition: all 0.2s;
  cursor: pointer;
  border: none;
  text-align: center;
}

.btn-primary {
  background-color: var(--accent-color);
  color: #fff;
  box-shadow: 0 0 15px rgba(249, 115, 22, 0.4);
  animation: pulse 2s infinite;
}

.btn-primary:hover {
  background-color: var(--accent-hover);
  transform: translateY(-2px);
}

.btn-wa {
  background-color: var(--wa-color);
  color: #fff;
  box-shadow: none;
  animation: none;
}
.btn-wa:hover {
  background-color: #1ebc5b;
  transform: translateY(-2px);
}

.btn-outline {
  background-color: transparent;
  color: var(--text-main);
  border: 2px solid var(--border-color);
}

.btn-outline:hover {
  border-color: var(--text-main);
  background-color: rgba(255,255,255,0.05);
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(249, 115, 22, 0); }
  100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
}

/* Typography & Accent */
.accent {
  color: var(--accent-color);
}

.badge {
  display: inline-block;
  background-color: rgba(249, 115, 22, 0.1);
  color: var(--accent-color);
  padding: 4px 12px;
  border-radius: 100px;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 1rem;
  border: 1px solid rgba(249, 115, 22, 0.2);
}

.section-tag {
  color: var(--accent-color);
  font-weight: 600;
  font-size: 0.9rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 0.5rem;
  display: block;
}

/* Sections & Layout */
section {
  padding: 80px 0;
}

.bg-surface {
  background-color: var(--surface-color);
}

.section-header {
  margin-bottom: 3rem;
}

.section-header h2 {
  font-size: 3rem;
}

/* Hero */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  position: relative;
  padding-top: var(--nav-height);
  background-color: var(--bg-color);
  background-image: linear-gradient(to right, rgba(10,15,26,0.9) 0%, rgba(10,15,26,0.7) 100%), url('https://images.unsplash.com/photo-1581092160562-40aa08e78837?auto=format&fit=crop&w=1400&q=80');
  background-size: cover;
  background-position: center;
}

.hero-short {
  min-height: 40vh;
  padding-top: calc(var(--nav-height) + 40px);
  padding-bottom: 40px;
}

.hero-content {
  max-width: 800px;
  position: relative;
  z-index: 2;
}

.hero h1 {
  font-size: 5rem;
  margin-bottom: 1rem;
}

.hero p {
  font-size: 1.25rem;
  color: var(--text-muted);
  margin-bottom: 2rem;
  max-width: 600px;
}

.hero-buttons {
  display: flex;
  gap: 1rem;
}

/* Stats Strip */
.stats-strip {
  background-color: var(--surface-color);
  border-top: 1px solid var(--border-color);
  border-bottom: 1px solid var(--border-color);
  padding: 20px 0;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.stat-item {
  text-align: center;
  padding: 0 20px;
}

.stat-item:not(:last-child) {
  border-right: 1px solid var(--border-color);
}

.stat-num {
  display: block;
  font-family: var(--font-heading);
  font-size: 2.5rem;
  color: var(--accent-color);
  line-height: 1;
}

.stat-lbl {
  font-size: 0.85rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Trust Bar */
.trust-bar {
  background-color: var(--surface-color);
  padding: 30px 0;
  border-bottom: 1px solid var(--border-color);
}

.trust-flex {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 20px;
}

.trust-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--text-muted);
}

.trust-item svg {
  width: 20px;
  height: 20px;
  fill: var(--wa-color);
}

/* Cards & Grids */
.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 30px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
}

.service-card {
  background-color: var(--surface-color);
  padding: 30px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  transition: transform 0.3s, border-color 0.3s;
  display: flex;
  flex-direction: column;
}

.service-card:hover {
  transform: translateY(-5px);
  border-color: var(--accent-color);
}

.service-icon {
  font-size: 2.5rem;
  margin-bottom: 1rem;
  display: inline-block;
}

.service-card h3 {
  font-size: 1.5rem;
  margin-bottom: 0.5rem;
}

.service-card p {
  color: var(--text-muted);
  margin-bottom: 1.5rem;
  flex-grow: 1;
}

.service-cta {
  color: var(--accent-color);
  font-weight: 600;
  font-size: 0.9rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  display: inline-flex;
  align-items: center;
}
.service-cta:hover {
  text-decoration: underline;
}

/* List variants */
.service-row {
  display: flex;
  align-items: center;
  gap: 30px;
  padding: 30px 0;
  border-bottom: 1px solid var(--border-color);
}

.service-row:last-child {
  border-bottom: none;
}

.service-row .service-icon {
  font-size: 3rem;
  margin-bottom: 0;
  background-color: var(--surface-color);
  width: 80px;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 1px solid var(--border-color);
  flex-shrink: 0;
}

.service-row-content {
  flex-grow: 1;
}

.service-row h3 {
  font-size: 1.8rem;
  margin-bottom: 0.5rem;
}

.service-row p {
  color: var(--text-muted);
}

/* Inline CTA Strip */
.inline-cta-strip {
  background-color: var(--surface-hover);
  padding: 20px;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 30px 0;
  border: 1px dashed var(--border-color);
}

/* Emergency CTA Panel */
.emergency-cta {
  background-color: var(--surface-color);
  text-align: center;
  border-top: 2px solid var(--accent-color);
}

.emergency-cta h2 {
  font-size: 4rem;
  margin-bottom: 2rem;
  color: #fff;
}

.emergency-cta p {
  margin-top: 1rem;
  color: var(--text-muted);
  font-size: 0.9rem;
}

/* About Layout */
.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 50px;
  align-items: center;
}

.about-img {
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border-color);
}

.pull-quote {
  font-size: 1.5rem;
  font-style: italic;
  color: var(--accent-color);
  border-left: 4px solid var(--accent-color);
  padding-left: 20px;
  margin: 2rem 0;
}

/* Contact Cards */
.contact-card {
  background-color: var(--surface-color);
  padding: 40px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  text-align: center;
}
.contact-card h3 {
  font-size: 1.5rem;
  margin-bottom: 1rem;
}
.phone-huge {
  font-family: var(--font-heading);
  font-size: 3rem;
  color: var(--text-main);
  display: block;
  margin: 1rem 0 2rem 0;
}

/* Hours Panel */
.hours-panel {
  background-color: var(--surface-color);
  padding: 30px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  max-width: 600px;
  margin: 0 auto;
}
.hour-row {
  display: flex;
  justify-content: space-between;
  padding: 15px 0;
  border-bottom: 1px solid var(--border-color);
}
.hour-row:last-child {
  border-bottom: none;
}
.hour-emergency {
  color: var(--accent-color);
  font-weight: 600;
  font-size: 1.1rem;
}

/* Pills / Coverage */
.pill-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 15px;
  margin: 2rem 0;
}

.pill {
  background-color: var(--surface-color);
  border: 1px solid var(--border-color);
  padding: 12px 20px;
  border-radius: 100px;
  text-align: center;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.pill:before {
  content: "📍";
  font-size: 1rem;
}

/* WhatsApp FAB */
.fab-wa {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 60px;
  height: 60px;
  background-color: var(--wa-color);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  color: white;
  box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
  z-index: 1000;
  transition: transform 0.3s;
}

.fab-wa:hover {
  transform: scale(1.1);
}

/* Footer */
footer {
  background-color: #05080d;
  padding: 30px 0;
  text-align: center;
  border-top: 1px solid var(--border-color);
  font-size: 0.9rem;
  color: var(--text-muted);
}

/* Animations */
.fade-up {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease-out, transform 0.6s ease-out;
}
.fade-up.visible {
  opacity: 1;
  transform: translateY(0);
}

/* Responsive */
@media (max-width: 720px) {
  h1 { font-size: 3.5rem; }
  h2 { font-size: 2.5rem; }
  
  .nav-links {
    display: none;
    position: absolute;
    top: var(--nav-height);
    left: 0;
    width: 100%;
    background-color: var(--bg-color);
    flex-direction: column;
    padding: 20px;
    border-bottom: 1px solid var(--border-color);
  }
  
  .nav-links.active {
    display: flex;
  }
  
  .hamburger {
    display: block;
  }
  
  .nav-phone {
    margin-right: 15px;
    padding: 6px 12px;
  }
  
  .hero-buttons {
    flex-direction: column;
  }
  
  .stats-grid, .grid-2, .grid-3, .about-grid {
    grid-template-columns: 1fr;
  }
  
  .stat-item:not(:last-child) {
    border-right: none;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 15px;
    margin-bottom: 15px;
  }
  
  .service-row {
    flex-direction: column;
    text-align: center;
    gap: 15px;
  }
  
  .service-row .btn {
    width: 100%;
    margin-top: 15px;
  }

  .inline-cta-strip {
    flex-direction: column;
    text-align: center;
    gap: 15px;
  }
}
</style>
